[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiencedb"
version = "2.1.0"
description = "A Python database abstraction layer supporting PostgreSQL, SQLite, MySQL and MariaDB."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["database", "abstraction", "sql", "query-builder", "postgresql", "sqlite", "mysql", "mariadb"]

authors = [
    {name = "UniForceMusic"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "psycopg[binary]>=3.1",
    "mysql-connector-python>=9.0",
]

[project.urls]
Repository = "https://github.com/UniForceMusic/python-sentiencedb"
Changelog = "https://github.com/UniForceMusic/python-sentiencedb/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Both drivers are regular dependencies since 2.1.0; these extras stay (empty) so existing
# `pip install "sentiencedb[postgres]"` / `"sentiencedb[mysql]"` commands keep working.
postgres = []
mysql = []
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentiencedb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "integration: needs a running database server (skipped when it is unreachable)",
]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["mysql.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
