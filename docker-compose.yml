services:
  mysql:
    image: mysql:latest
    command:
      - '--skip-log-bin'
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - public
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 2s
      retries: 5

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
    ports:
      - 3307:3306
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - public
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - 5432:5432
    networks:
      - public
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 30s

networks:
  public:

volumes:
  mariadb-data:
  mysql-data:
  postgres-data:

